<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tdodbomweb</title>

<style>

.instagram-btn{
    display:inline-block;
    margin-top:0px;
    background:rgba(255,215,0,0.65);
    color:#FFFFFF;
    text-decoration:none;
    padding:12px 25px;
    border-radius:30px;
    font-size:18px;
    font-weight:bold;
        0 0 5px #FFD700,
        0 0 10px #FFD700;
    box-shadow:0 0 15px #FFD700;
    transition:.3s;
}
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(#000000,#3b210f);
    color:white;
    text-align:center;
}

.container{
    width:90%;
    max-width:420px;
    margin:30px auto;
    background:#1a0d05;
    border:3px solid #FFFFFF;
    border-radius:25px;
    padding:20px;
    box-shadow:
        0 0 10px #FFFFFF,
        0 0 20px #FFD700,
        0 0 30px #FFD700;
}

.logo{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:50%;
    border:3px solid #d4af37;
    box-shadow:0 0 20px #d4af37;
    margin-bottom:20px;
}

h1{
    color:#FFD700;
    font-size:38px;
    margin-bottom:20px;
    text-shadow:0 0 10px #FFD700;
}

.player{
    position:relative;
    background-image:url("banner.jpeg");
    background-size:cover;
    background-position:center;
    border-radius:20px;
    overflow:hidden;
    padding:20px;
}

.player::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.60);
}

.player *{
    position:relative;
    z-index:1;
}

.live{
    color:#FFD700;
    font-size:26px;
    font-weight:bold;
    text-shadow:
        0 0 5px #FFD700,
        0 0 10px #FFD700,
        0 0 20px #FFA500;
    animation:pulse 1.5s infinite;
    margin-bottom:15px;
}

@keyframes pulse{
    0%{opacity:1;}
    50%{opacity:.5;}
    100%{opacity:1;}
}

.equalizer{
    display:flex;
    justify-content:center;
    gap:4px;
    margin-bottom:15px;
}

.equalizer span{
    width:5px;
    height:20px;
    background:#FFD700;
    border-radius:5px;
    animation:bars 1s infinite;
}

.equalizer span:nth-child(2){animation-delay:.2s;}
.equalizer span:nth-child(3){animation-delay:.4s;}
.equalizer span:nth-child(4){animation-delay:.6s;}
.equalizer span:nth-child(5){animation-delay:.8s;}

@keyframes bars{
    0%,100%{height:10px;}
    50%{height:30px;}
}

.info{
    color:white;
    font-size:18px;
}

audio{
    width:100%;
    margin:20px 0;
}

button{
    background:rgba(255,215,0,0.45);
    color:white;
    border:2px solid rgba(255,215,0,0.80);
    border-radius:35px;
    padding:15px 35px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    text-shadow:
        0 0 5px #FFD700;
    box-shadow:
        0 0 15px #FFD700,
        0 0 25px rgba(255,215,0,0.60);
    backdrop-filter:blur(5px);
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 30px #FFD700;
}

.footer{
    margin-top:20px;
    color:#d4af37;
    font-size:14px;
}

</style>

</head>

<body>

<div class="container">

<img src="logo.png" class="logo" alt="Logo">

<h1>Tdodbomweb</h1>

<div class="player">

<div class="live">
📡 AO VIVO
</div>

<div class="equalizer">
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
</div>

<p class="info">
🎶 A rádio que toca seu coração
</p>

<audio controls>
<source src="https://tdodbomweb.out.airtime.pro/tdodbomweb_a" type="audio/mpeg">
</audio>

<button>📻 Ouvir Agora</button>

<p class="info">
🎵 Tocando agora
</p>
<a href="https://www.instagram.com/tdodbomweb/" target="_blank" class="instagram-btn">
📸 @tdodbomweb
</a>

}

</div>

<div class="footer">
© 2026 Tdodbomweb - Todos os direitos reservados.
</div>

</div>

</body>
</html>
